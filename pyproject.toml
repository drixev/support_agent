[project]
name = "support-agent"
version = "0.1.0"
requries-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standar]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
lint.select = ["E","F","I","UP","B","ASYNC"]